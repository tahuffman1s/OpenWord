name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/OpenWord-${TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Serve CanvasKit from the bundle so the build works without the CDN.
      - run: flutter build web --release --no-web-resources-cdn
      - run: |
          mkdir -p dist
          (cd build/web && zip -qr "../../dist/OpenWord-${TAG}-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf \
            "dist/OpenWord-${TAG}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: bash
        run: |
          mkdir -p dist
          (cd build/windows/x64/runner/Release &&
            7z a "../../../../../dist/OpenWord-${TAG}-windows-x64.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: [android, web, linux, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the notes for this version
        run: |
          version="${TAG#v}"
          awk -v want="## $version" '
            $0 == want { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-footer.md >> notes.md
          test -s notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "OpenWord $TAG" \
            --notes-file notes.md \
            --verify-tag \
            artifacts/*/*
