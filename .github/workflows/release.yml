name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.0.0
        required: true

env:
  TAG: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('v{0}', github.event.inputs.version)
        || github.ref_name }}

jobs:
  # Running this by hand creates the tag; a tag push finds it already there.
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" \
              >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "OpenWord $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  android:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/OpenWord-${TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  web:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Serve CanvasKit from the bundle so the build works without the CDN.
      - run: flutter build web --release --no-web-resources-cdn
      - run: |
          mkdir -p dist
          (cd build/web && zip -qr "../../dist/OpenWord-${TAG}-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf \
            "dist/OpenWord-${TAG}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: bash
        run: |
          mkdir -p dist
          (cd build/windows/x64/runner/Release &&
            7z a "../../../../../dist/OpenWord-${TAG}-windows-x64.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: [android, web, linux, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the notes for this version
        run: |
          version="${TAG#v}"
          awk -v want="## $version" '
            $0 == want { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-footer.md >> notes.md
          test -s notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running the workflow for a version updates that release rather
          # than failing, so a fix to the notes does not need a new version.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "OpenWord $TAG" \
              --notes-file notes.md
            gh release upload "$TAG" artifacts/*/* --clobber
          else
            gh release create "$TAG" \
              --title "OpenWord $TAG" \
              --notes-file notes.md \
              --verify-tag \
              artifacts/*/*
          fi
