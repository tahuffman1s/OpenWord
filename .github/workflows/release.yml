name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.0.0
        required: true

env:
  TAG: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('v{0}', github.event.inputs.version)
        || github.ref_name }}

jobs:
  # Running this by hand creates the tag; a tag push finds it already there.
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" \
              >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "OpenWord $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  android:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Android will only replace an installed app with one signed by the
      # same key. The debug keystore is generated afresh on every runner, so
      # a debug-signed release can never update the one before it; the real
      # key comes out of a secret. Without it the build still runs, and the
      # release says plainly that it cannot update in place.
      - name: Take out the signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/openword.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo 'No ANDROID_KEYSTORE_BASE64 secret; falling back to the' \
              'debug key. This APK will not update an installed copy.'
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        env:
          OPENWORD_KEYSTORE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/openword.jks', runner.temp) || '' }}
          OPENWORD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENWORD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENWORD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Say which key signed it
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner \
            | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" \
              | grep -i 'SHA-256 digest' || true
          fi
          echo "signed with the release key: ${{ steps.signing.outputs.signed }}"

      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/OpenWord-${TAG}-android.apk"
          echo "${{ steps.signing.outputs.signed }}" > dist/signed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  web:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Serve CanvasKit from the bundle so the build works without the CDN.
      - run: flutter build web --release --no-web-resources-cdn
      - run: |
          mkdir -p dist
          (cd build/web && zip -qr "../../dist/OpenWord-${TAG}-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf \
            "dist/OpenWord-${TAG}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    needs: tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: bash
        run: |
          mkdir -p dist
          (cd build/windows/x64/runner/Release &&
            7z a "../../../../../dist/OpenWord-${TAG}-windows-x64.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: [android, web, linux, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the notes for this version
        run: |
          version="${TAG#v}"
          awk -v want="## $version" '
            $0 == want { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-footer.md >> notes.md
          # An APK signed with a throwaway debug key cannot replace an
          # installed copy, and the release should not pretend otherwise.
          if [ "$(cat artifacts/android/signed.txt 2>/dev/null)" != "true" ]; then
            {
              echo
              echo '> **This Android build is signed with a throwaway debug'
              echo '> key**, because the repository has no signing secret yet.'
              echo '> Android will not install it over a copy signed by a'
              echo '> different key: copy a backup from Settings, remove the'
              echo '> copy you have, install this one, then restore. See'
              echo '> "Releases" in the README.'
            } >> notes.md
          fi
          test -s notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running the workflow for a version updates that release rather
          # than failing, so a fix to the notes does not need a new version.
          # signed.txt is a note to this workflow, not a release asset.
          ASSETS=$(find artifacts -type f ! -name signed.txt | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "OpenWord $TAG" \
              --notes-file notes.md
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" \
              --title "OpenWord $TAG" \
              --notes-file notes.md \
              --verify-tag \
              $ASSETS
          fi
