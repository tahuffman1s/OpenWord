name: CI

# OpenWord ships as two Docker images, and everything here is about them:
#
#   ghcr.io/<owner>/openword-web   nginx, the app, the Scripture and the voice
#   ghcr.io/<owner>/openword-api   the Go API
#
#   checks    the app's and the API's own tests, and the deployment's files
#   images    builds both images from the real Dockerfiles, starts them under
#             the real compose file with Postgres, and tests the running
#             stack from outside: over HTTP, then in a browser
#   publish   on main and on a v* tag, once all of that has passed, pushes
#             the same two images to the registry for linux/arm64 (a
#             Raspberry Pi) and linux/amd64
#
# Nothing is published that has not been run.
#
# A v* tag is made by release.yml, which starts this workflow on it.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a branch supersedes the run before it; a run that may
  # be publishing is left to finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  app:
    name: App tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Run against the Scripture, maps, references and originals that ship.
      - run: npm test

  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - name: Formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  deployment:
    name: Deployment files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Compose files parse, in every combination the installer uses
        env:
          POSTGRES_PASSWORD: ci
        run: |
          docker compose -f docker-compose.yml --profile tunnel config --quiet
          docker compose -f docker-compose.yml -f docker-compose.lan.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml --profile tunnel config --quiet
          docker compose -f docker-compose.yml -f docker-compose.lan.yml -f docker-compose.prebuilt.yml config --quiet
      - name: Scripts are valid shell
        run: |
          bash -n install.sh backup.sh restore.sh smoke.sh
          shellcheck install.sh backup.sh restore.sh smoke.sh

  images:
    name: Build the images and run them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          load: true
          tags: openword-api:ci
          cache-from: type=gha,scope=openword-api
          cache-to: type=gha,scope=openword-api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          load: true
          tags: openword-web:ci
          cache-from: type=gha,scope=openword-web
          cache-to: type=gha,scope=openword-web,mode=max

      - name: Start the stack, as a Pi on a home network would
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-not-a-secret/' \
                 -e 's/^OPENWORD_VERSION=.*/OPENWORD_VERSION=ci/' .env
          # --no-build: the images just built, not a rebuild. --wait: until
          # every container's own healthcheck passes, or fail.
          docker compose -f docker-compose.yml -f docker-compose.lan.yml \
            up -d --no-build --wait --wait-timeout 180

      - name: Test the running stack over HTTP
        run: deploy/smoke.sh http://localhost:8080

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get a browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser" && cd "$RUNNER_TEMP/browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Test the running app in a browser
        run: node pwa/scripts/image-smoke.mjs http://localhost:8080

      - name: What it weighs
        if: always()
        run: |
          {
            echo '### The images'
            echo
            echo '```'
            docker image ls --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E 'REPOSITORY|openword-'
            echo '```'
            echo
            echo '### The stack, running'
            echo
            echo '```'
            docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What the containers said, if it failed
        if: failure()
        working-directory: deploy
        run: |
          docker compose -f docker-compose.yml -f docker-compose.lan.yml ps || true
          docker compose -f docker-compose.yml -f docker-compose.lan.yml logs --tail 200 || true

      - name: Stop the stack
        if: always()
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f docker-compose.lan.yml down -v || true

  publish:
    name: Publish ${{ matrix.name }}
    # Only what has been built, run and tested, and only from main or a
    # release tag: a branch or a pull request never publishes.
    needs: [app, api, deployment, images]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: deploy/web.Dockerfile
          - name: api
            context: server
            dockerfile: server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tags
        id: tags
        run: |
          # ghcr.io wants the owner in lower case, whatever the account is.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openword-${{ matrix.name }}"
          sha="sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A release: its own name, to pin a Pi to with OPENWORD_VERSION.
            version="$GITHUB_REF_NAME"
            tags="$image:$version,$image:$sha"
          else
            # main: "latest" is what an unpinned Pi pulls on `openword update`.
            version=latest
            tags="$image:latest,$image:main,$image:$sha"
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags=$tags"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing: $tags"

      # Both Dockerfiles run their build stage on the runner's own
      # architecture (FROM --platform=$BUILDPLATFORM): the app is static
      # files and Go cross-compiles, so QEMU only assembles the small final
      # stage for arm64 and never runs npm or a compiler under emulation.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=openword-${{ matrix.name }}
            org.opencontainers.image.description=OpenWord, a Bible to read, hear and learn by heart: the ${{ matrix.name }} image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
            org.opencontainers.image.licenses=MIT
          # The same cache the images job filled a few minutes ago, so this
          # is mostly the arm64 final stage and the push.
          cache-from: type=gha,scope=openword-${{ matrix.name }}
          # A single multi-arch manifest per tag, which is what
          # `docker compose pull` on a Pi resolves to its own architecture.
          provenance: false

      - name: Check both architectures are there
        run: |
          docker buildx imagetools inspect "${{ steps.tags.outputs.image }}:sha-${GITHUB_SHA::7}" | tee manifest.txt
          grep -q 'linux/arm64' manifest.txt
          grep -q 'linux/amd64' manifest.txt

      - name: Summary
        run: |
          {
            echo "### openword-${{ matrix.name }}"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
