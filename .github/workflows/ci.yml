name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The voice is fetched rather than kept in git; see
      # tool/fetch_voice.dart. Cached until that script changes.
      - uses: actions/cache@v4
        with:
          path: assets/voice/kitten.tar.gz
          key: voice-${{ hashFiles('tool/fetch_voice.dart') }}
      - run: dart run tool/fetch_voice.dart
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      # The shipped Scripture is a binary; check it is one a reader can
      # open, that its outline matches its text, and that its metadata
      # describes what is actually in it.
      - run: dart run tool/bib_lint.dart assets/bible/*.bib

  # The PWA (pwa/) and the API (server/) that deploy/ puts on a Raspberry Pi.
  # Independent of the Flutter jobs: neither needs the other's toolchain.
  pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
      # Both are generated and git-ignored: the bundled Scripture is copied
      # in from ../assets, and the icon table is cut from icons.txt.
      - run: node scripts/sync-assets.mjs
      - run: node scripts/gen-icons.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # What deploy/nginx.conf and deploy/web.Dockerfile rely on being there.
      - name: Check the shape of the build
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -d dist/assets/bible
          test -f dist/ort/ort-wasm-simd-threaded.wasm

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...

  # The deployment itself: the compose files must parse in every combination
  # the installer uses, and the shell scripts must at least be valid shell.
  deploy-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Compose files parse
        env:
          POSTGRES_PASSWORD: ci
        run: |
          docker compose -f docker-compose.yml --profile tunnel config --quiet
          docker compose -f docker-compose.yml -f docker-compose.lan.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml --profile tunnel config --quiet
          docker compose -f docker-compose.yml -f docker-compose.lan.yml -f docker-compose.prebuilt.yml config --quiet
      - name: Scripts are valid shell
        run: |
          bash -n install.sh backup.sh restore.sh
          shellcheck install.sh backup.sh restore.sh

  build-web:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The voice is fetched rather than kept in git; see
      # tool/fetch_voice.dart. Cached until that script changes.
      - uses: actions/cache@v4
        with:
          path: assets/voice/kitten.tar.gz
          key: voice-${{ hashFiles('tool/fetch_voice.dart') }}
      - run: dart run tool/fetch_voice.dart
      # Release, not debug: the release build is the one with the signing
      # script in it, and a mistake there should fail here rather than at
      # release time. Without the signing secret it falls back to the debug
      # key, which is what a CI build wants anyway.
      - run: flutter build apk --release
