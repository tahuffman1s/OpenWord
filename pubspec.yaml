name: openword
description: "OpenWord — a free and open source Bible app with Material You theming."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Material You: reads the platform's dynamic color palette when available.
  dynamic_color: ^1.7.0
  # Gunzips the bundled Scripture; pure Dart, so it works on the web too.
  archive: ^4.0.0
  # Reading position, marks and settings.
  shared_preferences: ^2.3.2
  # USFX parsing. Only tool/build_assets.dart and the tests reach for this;
  # the app itself reads the built assets, so it is tree-shaken out of
  # release binaries.
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/bible/
    - assets/notes/

  # Literata (SIL Open Font License 1.1) is bundled so the reading typeface is
  # identical on every platform, including the web build where the generic
  # "serif" family is not resolvable. Subset to Latin, Greek and the
  # punctuation the text uses; see assets/fonts/Literata-OFL.txt.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
        - asset: assets/fonts/Literata-BoldItalic.ttf
          weight: 700
          style: italic
