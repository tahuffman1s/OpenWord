name: openword
description: "OpenWord — a free and open source Bible app with Material You theming."
publish_to: 'none'
version: 1.20.4+31

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Material You: reads the platform's dynamic color palette when available.
  dynamic_color: ^1.7.0
  # Gunzips the bundled Scripture and checksums its chunks; pure Dart, so it
  # works on the web too.
  archive: ^4.0.0
  # Unicode normalisation. An EPUB may carry its accents and its Hebrew
  # points decomposed, which looks identical on screen and matches nothing
  # a reader types; imported text is composed to NFC on the way in. Pure
  # Dart, so it works on the web too.
  unorm_dart: ^0.3.0
  # SHA-256 of a .bib file's Scripture, so two copies can be told apart
  # without comparing megabytes. Already in the tree as a transitive
  # dependency; named here because the app imports it directly.
  crypto: ^3.0.0
  # Reading position, marks and settings.
  shared_preferences: ^2.3.2
  # USFX parsing. Only tool/build_assets.dart and the tests reach for this;
  # the app itself reads the built assets, so it is tree-shaken out of
  # release binaries.
  xml: ^6.5.0
  # Choosing an EPUB or a .bib to import, and saving one back out. The
  # picker hands over the bytes; nothing is uploaded anywhere.
  file_picker: ^13.1.0
  # Where imported translations are kept — the app's own documents directory.
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  flutter_tts: ^4.2.5
  audio_service: ^0.18.19
  # OpenWord's own voices: open neural text-to-speech models, run on the
  # device. The models are downloaded when asked for, never bundled.
  sherpa_onnx: ^1.13.8
  # Plays what those voices make.
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/bible/
    - assets/notes/
    - assets/maps/
    - assets/refs/
    - assets/strongs/

  # Literata (SIL Open Font License 1.1) is bundled so the reading typeface is
  # identical on every platform, including the web build where the generic
  # "serif" family is not resolvable. Subset to Latin, Greek and the
  # punctuation the text uses; see assets/fonts/Literata-OFL.txt.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
        - asset: assets/fonts/Literata-BoldItalic.ttf
          weight: 700
          style: italic

    # Literata carries no Hebrew, and a platform cannot be relied on to have
    # a face with the vowel points and cantillation marks the Hebrew Bible
    # uses — the web has none at all. Nor does Literata have the modifier
    # letters Strong's transliterates with: ʻayin, ʼaleph, the superscript
    # vowels. This face is Noto Serif Hebrew and Noto Serif merged and cut
    # down to exactly those two gaps — the Hebrew block and thirteen Latin
    # marks, 16 kB. SIL Open Font License 1.1; see
    # assets/fonts/NotoSerif-OFL.txt.
    - family: ScriptureSerif
      fonts:
        - asset: assets/fonts/ScriptureSerif-Subset.ttf
          weight: 400
