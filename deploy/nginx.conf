# Serving OpenWord: the PWA as static files, /api/ proxied to the Go API.
#
# This file is included inside nginx's http{} block (conf.d/*.conf), which
# is why it may open with map{} blocks: they decide the Cache-Control for a
# response from its URI, so the header is declared once, below, instead of
# being repeated in every location (add_header in a location *replaces* the
# whole inherited set, which is how headers silently go missing).
#
# What the build puts under the root, and how long a browser may keep it:
#
#   /index.html, /sw.js, /manifest.webmanifest, /icons/*, /version.json
#       no-cache + ETag. The service worker and the page that registers it
#       decide when a client picks up a new build; a warm load is a few 304s.
#   /assets/<name>-<hash>.<ext>, /workbox-<hash>.js
#       Vite's content-hashed output: a year, immutable. A new build has new
#       names, so nothing stale is ever served under an old one.
#   /assets/{bible,maps,notes,refs,strongs,fonts,licences}/...
#       the app's data, copied from the repository's assets/ with its
#       filenames unchanged, so it may change between releases: a day + ETag.
#   /voice/<model-name>/..., /ort/...
#       versioned by directory name: a year. Not immutable, so a rebuilt
#       runtime under the same path still revalidates eventually.
#   /api/
#       whatever the API says; nginx adds nothing (an empty value makes
#       add_header skip the header).
#
# Two kinds of file must go out as opaque bytes, never with Content-Encoding:
# the .bib translations and the .gz originals/cross-references, which the
# app gunzips itself, and the voice's .onnx/.bin, which the app reads with
# Range requests. web.Dockerfile never writes a .gz sibling for any of those,
# and gzip_static only ever serves a sibling that exists.

map $uri $openword_cache_control {
    default                                                       "no-cache";
    "~^/api/"                                                     "";
    "~^/assets/(bible|maps|notes|refs|strongs|fonts|licences)/"   "public, max-age=86400";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{6,}\.[A-Za-z0-9]+$"            "public, max-age=31536000, immutable";
    "~^/workbox-[A-Za-z0-9_-]+\.js$"                              "public, max-age=31536000, immutable";
    "~^/(voice|ort)/"                                             "public, max-age=31536000";
}

# What to tell the API the client used. Through the tunnel, Cloudflare sets
# X-Forwarded-Proto: https and the API marks its cookies Secure; on a plain
# LAN install nothing sets it and the API sees http, which is the truth.
map $http_x_forwarded_proto $openword_forwarded_proto {
    default  $scheme;
    "https"  "https";
    "http"   "http";
}

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens      off;
    absolute_redirect  off;
    sendfile           on;
    tcp_nopush         on;

    # nginx's own table, plus what the build ships that it lacks. A second
    # types{} in the same block extends the first rather than replacing it,
    # which a types{} *without* the include would do. .bin is already
    # application/octet-stream in the stock table; .bib and .onnx are not in
    # any table and would fall to default_type regardless, but say so.
    include /etc/nginx/mime.types;
    types {
        font/ttf                   ttf;
        font/otf                   otf;
        application/manifest+json  webmanifest;
        text/javascript            mjs;
        application/octet-stream   bib onnx;
    }
    default_type application/octet-stream;

    # Pre-compressed .gz siblings are built into the image, so the Pi spends
    # no CPU compressing on the fly.
    gzip_static  on;
    gzip         off;
    gzip_vary    on;
    etag         on;

    add_header Cache-Control           $openword_cache_control always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Permissions-Policy      "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
    # The voice runs its neural net on one thread unless the page is
    # cross-origin isolated. These two headers would give it threads, at the
    # price of refusing any cross-origin resource that does not opt in with
    # CORP/CORS; the app loads none today, but leave them off unless you
    # have checked every image and embed on your instance.
    # add_header Cross-Origin-Opener-Policy   "same-origin" always;
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # For the compose healthcheck and for Cloudflare's origin probes.
    location = /healthz {
        access_log    off;
        default_type  text/plain;
        add_header    Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The API. The upstream is named through a variable on purpose: nginx
    # then resolves "api" per request through Docker's DNS instead of once
    # at startup, so web starts even if api is still coming up, and follows
    # api to a new address when it restarts, instead of serving 502s until
    # someone restarts web too. With no URI part on proxy_pass the request
    # URI goes through unchanged, /api/... and all.
    location /api/ {
        resolver            127.0.0.11 valid=30s ipv6=off;
        set                 $openword_api http://api:8080;
        proxy_pass          $openword_api;

        proxy_http_version  1.1;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $openword_forwarded_proto;
        proxy_set_header    X-Forwarded-Host   $host;
        proxy_set_header    Connection         "";

        # Avatars and backups are uploaded whole; the API itself caps them
        # at 4 MB, so 8 MB here only means nginx is never the one to say no.
        client_max_body_size      8m;
        proxy_request_buffering   off;
        proxy_connect_timeout     5s;
        proxy_send_timeout        60s;
        proxy_read_timeout        60s;
    }

    # Files, not pages: a missing one is a 404, never index.html. The ^~
    # prefix makes these win outright, so nothing below can catch them.
    location ^~ /assets/ { try_files $uri =404; }
    location ^~ /voice/  { try_files $uri =404; }
    location ^~ /ort/    { try_files $uri =404; }
    location ^~ /icons/  { try_files $uri =404; }

    # Everything else is the app: a real file if there is one, otherwise the
    # shell, which routes the path itself.
    location / {
        try_files $uri /index.html;
    }
}
