# Serving the OpenWord web build.
#
# Two things about a Flutter web bundle drive everything here. First, none of
# its filenames are content-hashed: main.dart.js is called main.dart.js in
# every build. Nothing may be cached immutably, or a redeploy would serve the
# old app for as long as the browser kept it. Second, several of its assets
# are gzip *content* — originals.ows.gz, xrefs.owx.gz, and the .bib files,
# which the app unpacks itself. They must go out as opaque bytes; if a server
# ever set Content-Encoding on them the browser would unpack them early and
# the app's own gunzip would fail on what was left.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # .ttf and .otf are missing from nginx's own table and the app bundles
    # both, so the Dockerfile appends them to mime.types. They cannot be
    # added with a types{} block here: that *replaces* the inherited map
    # rather than extending it, and index.html and canvaskit.wasm would lose
    # their own types — which breaks the page outright.

    # Pre-compressed .gz siblings are built into the image, so the Pi spends
    # no CPU compressing on the fly. Only files the build actually
    # pre-compressed are candidates; the app's own .gz assets have no .gz.gz
    # beside them, so this can never rewrite one of those.
    gzip_static on;
    gzip        off;

    # Revalidate everything. With ETags a warm load is a handful of 304s and
    # no bodies, which is the right trade when filenames never change.
    etag on;
    add_header Cache-Control "no-cache" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # For the compose healthcheck and for Cloudflare's origin probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The service worker and the version it checks decide when a client
    # picks up a new build, so they must never be served from cache.
    location ~* ^/(flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
